name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        content: [synthetic, official]
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_NOLOGO: 1
      NUGET_XMLDOC_MODE: skip
    steps:
      - uses: actions/checkout@v4
      - name: Check cross-platform executable discovery
        run: bash scripts/test-env.sh
      - name: Provision SDK, Godot .NET, and secret scanner
        run: ./scripts/bootstrap.sh
      - name: Provision pinned official card data
        if: matrix.content == 'official'
        run: ./scripts/update-card-data.sh --commit 236140cf84491c23995b028bc791281837520b97 --retrieval-date 2026-08-28
      - name: Complete repository gate
        run: |
          if [[ "${{ matrix.content }}" == "official" ]]; then
            make m4-gate
          else
            make verify
          fi
      - name: Offline benchmark smoke
        run: |
          if [[ "${{ matrix.content }}" == "official" ]]; then
            make ai-benchmark-smoke
          else
            make ai-benchmark-developer
          fi
