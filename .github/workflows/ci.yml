name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        content: [synthetic, official]
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_NOLOGO: 1
      NUGET_XMLDOC_MODE: skip
      NETRUNNER_M5_GATE_OUTPUT: artifacts/m5/ci-gate
    steps:
      - uses: actions/checkout@v4
      - name: Check cross-platform executable discovery
        run: bash scripts/test-env.sh
      - name: Provision SDK, Godot .NET, and secret scanner
        run: ./scripts/bootstrap.sh
      - name: Provision pinned official card data
        if: matrix.content == 'official'
        run: ./scripts/update-card-data.sh --commit 236140cf84491c23995b028bc791281837520b97 --retrieval-date 2026-08-28
      - name: Complete repository gate
        run: |
          if [[ "${{ matrix.content }}" == "official" ]]; then
            make m4-gate
          else
            make verify
          fi
      - name: Offline benchmark smoke
        run: |
          if [[ "${{ matrix.content }}" == "official" ]]; then
            make m5-quick
          else
            make ai-benchmark-developer
          fi
      - name: Frozen official tactical fixture and replay proof
        if: matrix.content == 'official'
        run: make ai-tactics-verify TACTICAL_ARGS='--workers 4'
      - name: Native developer workflow
        if: matrix.content == 'official'
        run: make m5-developer-smoke
      - name: Native saved-game restart flow
        if: matrix.content == 'official'
        run: bash scripts/m5-client-smoke.sh --quick
      - uses: actions/upload-artifact@v4
        if: always() && matrix.content == 'official'
        with:
          name: m5-quick-summary
          path: artifacts/m5/ci-gate/*-summary.json
          if-no-files-found: warn
          retention-days: 14
